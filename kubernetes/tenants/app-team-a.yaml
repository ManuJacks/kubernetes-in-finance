# Application tenant namespace: app-team-a.
#
# Owned by the platform. Pod Security "restricted" is enforced, and a quota
# caps what the tenant can consume on the 950 MiB workers. The sample
# workload gives incident tooling (production-debug) something real to
# diagnose. production-debug may be granted read access here only because
# its per-environment allowlist names this namespace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: app-team-a
  labels:
    app.kubernetes.io/part-of: kif-tenants
    kif.io/tenant: team-a
    # Platform approval for incident diagnostics: production-debug's admission
    # policy only admits its RoleBindings in namespaces carrying this label.
    production-debug/diagnosable: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: app-team-a
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 128Mi
    limits.memory: 256Mi
    pods: "6"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: app-team-a
  labels:
    app.kubernetes.io/name: web
    kif.io/tenant: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        kif.io/tenant: team-a
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 48Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: app-team-a
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - port: 80
      targetPort: 8080
