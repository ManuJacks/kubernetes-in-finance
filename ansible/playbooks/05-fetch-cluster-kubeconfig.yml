---
- name: Retrieve Kubernetes administrator kubeconfig
  hosts: tf-ha-control1
  become: true

  tasks:
    - name: Retrieve administrator kubeconfig
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ lookup('env', 'HOME') }}/.kube/kubernetes-in-finance.conf"
        flat: true

    - name: Restrict local kubeconfig permissions
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube/kubernetes-in-finance.conf"
        state: file
        mode: "0600"
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false
