---
- name: Generate a certificate upload encryption key
  ansible.builtin.command:
    argv:
      - kubeadm
      - certs
      - certificate-key
  register: kubeadm_certificate_key
  changed_when: false
  no_log: true

- name: Validate certificate upload key format
  ansible.builtin.assert:
    that:
      - kubeadm_certificate_key.stdout | length == 64
      - kubeadm_certificate_key.stdout is match('^[a-f0-9]{64}$')
    fail_msg: "Generated certificate key has an unexpected format."
  no_log: true

- name: Upload encrypted control-plane certificates
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - phase
      - upload-certs
      - --upload-certs
      - --certificate-key
      - "{{ kubeadm_certificate_key.stdout }}"
  register: kubeadm_certificate_upload
  changed_when: true
  no_log: true

- name: Generate a short-lived bootstrap token
  ansible.builtin.command:
    argv:
      - kubeadm
      - token
      - create
      - --ttl
      - "{{ kubernetes_bootstrap_token_ttl }}"
      - --description
      - "{{ kubernetes_bootstrap_token_description }}"
  register: kubeadm_bootstrap_token
  changed_when: true
  no_log: true

- name: Calculate the cluster CA certificate discovery hash
  ansible.builtin.shell: |
    set -o pipefail
    openssl x509 -pubkey -in "{{ kubernetes_ca_certificate }}" -noout \
      | openssl pkey -pubin -outform DER \
      | sha256sum \
      | awk '{print $1}'
  args:
    executable: /bin/bash
  register: kubeadm_ca_cert_hash
  changed_when: false
