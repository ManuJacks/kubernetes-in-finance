---
- name: Create Kubernetes configuration directory
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render kubeadm initialization configuration
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    owner: root
    group: root
    mode: "0600"

- name: Validate kubeadm initialization configuration
  ansible.builtin.command:
    argv:
      - kubeadm
      - config
      - validate
      - --config
      - /etc/kubernetes/kubeadm-init.yaml
  changed_when: false

- name: Check for existing kubeadm admin configuration
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Check for existing API server manifest
  ansible.builtin.stat:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
  register: kubeadm_apiserver_manifest

- name: Verify kubeadm initialization state is consistent
  ansible.builtin.assert:
    that:
      - kubeadm_admin_conf.stat.exists == kubeadm_apiserver_manifest.stat.exists
    fail_msg: >-
      Inconsistent kubeadm state: admin.conf and the API server manifest
      must either both exist or both be absent. Investigate before proceeding.

- name: Verify existing Kubernetes API health
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - --raw=/readyz
  register: kubeadm_api_health
  changed_when: false
  failed_when: kubeadm_api_health.rc != 0
  when: kubeadm_admin_conf.stat.exists

- name: Initialize the first control plane
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - --config
      - /etc/kubernetes/kubeadm-init.yaml
    creates: /etc/kubernetes/admin.conf
  when: not kubeadm_admin_conf.stat.exists
