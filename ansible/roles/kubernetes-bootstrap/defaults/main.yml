---
kubernetes_control_plane_endpoint: "10.97.3.100:6443"

kubernetes_pod_subnet: "10.244.0.0/16"
kubernetes_service_subnet: "10.112.0.0/12"

kubernetes_cri_socket: "unix:///run/containerd/containerd.sock"

kubernetes_api_server_cert_sans:
  - "10.97.3.100"

kubernetes_skip_phases:
  - addon/kube-proxy

# Bootstrap credential policy
kubernetes_bootstrap_token_ttl: "30m"
kubernetes_bootstrap_token_description: "ansible-control-plane-expansion"

# Kubernetes credential locations
kubernetes_admin_kubeconfig: "/etc/kubernetes/admin.conf"
kubernetes_ca_certificate: "/etc/kubernetes/pki/ca.crt"
