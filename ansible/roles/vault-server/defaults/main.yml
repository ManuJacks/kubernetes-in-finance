---
# Rebuilds the host's Vault service from the repository (DR plan gap T5,
# ADR-007 item 8). Values match the running service as of 2026-11-27.
vault_version: "2.2.2-1"
vault_node_id: kif-vault-01
vault_hostname: vault.kif.io
vault_listen_ip: 10.97.3.1          # host address on br-api-frontend (09-host-networking.yml)
vault_data_dir: /opt/vault/data
vault_tls_dir: /opt/vault/tls
vault_config_dir: /etc/vault.d
vault_apt_key_url: https://apt.releases.hashicorp.com/gpg
vault_apt_keyring: /usr/share/keyrings/hashicorp-archive-keyring.gpg
# The Ubuntu suite, not the distribution's own codename: this host is Linux
# Mint "zena" on Ubuntu "noble", and HashiCorp publishes only Ubuntu suites.
# (ansible_distribution_release is "zena" here; using it would write a
# repository line apt cannot fetch. Found by --check on 2026-11-28.)
vault_apt_suite: noble
vault_apt_repo: >-
  deb [arch=amd64 signed-by={{ vault_apt_keyring }}]
  https://apt.releases.hashicorp.com {{ vault_apt_suite }} main
# Directory on the host holding tls.crt and tls.key, restored from backup by
# the operator. The key is never in this repository. Leave empty to keep the
# files already in vault_tls_dir.
vault_tls_source_dir: ""
