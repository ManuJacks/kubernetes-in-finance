---
- name: Refresh APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common Kubernetes prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gpg
      - jq
      - vim
      - git
      - socat
      - conntrack
      - ipset
      - iptables
      - ebtables
      - ethtool
    state: present

- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load overlay kernel module
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter kernel module
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Configure Kubernetes networking sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-ip6tables = 1

- name: Apply sysctl configuration
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

# Node hygiene (INC-2026-11-22-worker2-memory): on 950 MiB nodes a background
# apt run (apt-check, ~100 MiB) starved the kubelet and took a worker
# NotReady. Package updates on cluster nodes are applied deliberately by
# Ansible (one node at a time), never by timers or on SSH login.
- name: Disable periodic APT updates and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (roles/common). Updates are applied deliberately.
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
  tags: [node-hygiene]

- name: Stop and disable APT timers and the unattended-upgrades service
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - unattended-upgrades.service
  failed_when: false
  tags: [node-hygiene]

- name: Find login MOTD scripts that run apt or network checks
  ansible.builtin.find:
    paths: /etc/update-motd.d
    patterns:
      - 50-landscape-sysinfo
      - 50-motd-news
      - 90-updates-available
      - 91-contract-ua-esm-status
      - 91-release-upgrade
      - 92-unattended-upgrades
  register: common_motd_scripts
  tags: [node-hygiene]

- name: Stop those MOTD scripts running on every SSH login (including Ansible's)
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0644"
  loop: "{{ common_motd_scripts.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags: [node-hygiene]
