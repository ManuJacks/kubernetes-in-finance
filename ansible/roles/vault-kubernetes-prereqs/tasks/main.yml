---
- name: Validate KIF kubeconfig exists
  ansible.builtin.assert:
    that:
      - vault_kubeconfig is file
    fail_msg: "The KIF kubeconfig is required; run playbook 05 first."

- name: Ensure local Vault integration state directory exists
  ansible.builtin.file:
    path: "{{ vault_kubernetes_ca_file | dirname }}"
    state: directory
    mode: "0700"

- name: Render Kubernetes TokenReview identity
  ansible.builtin.template:
    src: token-reviewer.yaml.j2
    dest: "{{ vault_kubernetes_ca_file | dirname }}/vault-token-reviewer.yaml"
    mode: "0600"

- name: Apply Kubernetes TokenReview identity
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ vault_kubeconfig }}"
      - apply
      - -f
      - "{{ vault_kubernetes_ca_file | dirname }}/vault-token-reviewer.yaml"
  register: vault_token_reviewer_apply
  changed_when: "'created' in vault_token_reviewer_apply.stdout or 'configured' in vault_token_reviewer_apply.stdout"

- name: Wait for the TokenReview credential to be populated
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ vault_kubeconfig }}"
      - -n
      - "{{ vault_token_reviewer_namespace }}"
      - get
      - secret
      - "{{ vault_token_reviewer_secret }}"
      - -o
      - jsonpath={.data.token}
  register: vault_token_reviewer_secret_token
  until: vault_token_reviewer_secret_token.stdout | length > 0
  retries: 10
  delay: 2
  changed_when: false
  no_log: true

- name: Read Kubernetes API endpoint from the KIF kubeconfig
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ vault_kubeconfig }}"
      - config
      - view
      - --minify
      - -o
      - jsonpath={.clusters[0].cluster.server}
  register: vault_kubernetes_host
  changed_when: false

- name: Read Kubernetes CA for manual Vault configuration
  ansible.builtin.shell: >-
    kubectl --kubeconfig {{ vault_kubeconfig | quote }}
    -n {{ vault_token_reviewer_namespace | quote }}
    get configmap kube-root-ca.crt
    -o jsonpath='{.data.ca\.crt}'
  args:
    executable: /bin/bash
  register: vault_kubernetes_ca
  changed_when: false
  no_log: true

- name: Save Kubernetes CA for manual Vault configuration
  ansible.builtin.copy:
    content: "{{ vault_kubernetes_ca.stdout }}\n"
    dest: "{{ vault_kubernetes_ca_file }}"
    mode: "0600"
  no_log: true

- name: Report manual Vault configuration inputs without credentials
  ansible.builtin.debug:
    msg:
      - "Kubernetes TokenReview identity: {{ vault_token_reviewer_namespace }}/{{ vault_token_reviewer_serviceaccount }}"
      - "TokenReview credential: Secret {{ vault_token_reviewer_namespace }}/{{ vault_token_reviewer_secret }} (long-lived)"
      - "Kubernetes API endpoint: {{ vault_kubernetes_host.stdout }}"
      - "Kubernetes issuer: https://kubernetes.default.svc.cluster.local"
      - "Kubernetes CA saved at: {{ vault_kubernetes_ca_file }}"
      - "Vault-side auth configuration remains a manual, human-authorized step."
