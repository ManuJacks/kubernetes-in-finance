---
crictl_version: "v1.37.0"
crictl_arch: "amd64"
crictl_install_path: "/usr/local/bin/crictl"
crictl_archive_name: "crictl-{{ crictl_version }}-linux-{{ crictl_arch }}.tar.gz"
crictl_download_url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/{{ crictl_archive_name }}"
# On disk, not /tmp: /tmp is tmpfs (RAM) on these nodes, and archives left
# there held ~190 MiB of a 950 MiB worker (INC-2026-11-22-worker2-memory).
# Kept as a cache: get_url verifies the checksum and skips the download.
crictl_download_dir: "/var/cache/kubernetes-in-finance/crictl"
crictl_archive_checksum: "sha256:67c983ee8a6bbce73d39a186e633c5fe4f8a70e62171ac3bd92a9c1b2c601670"
