---
containerd_version: "2.3.7"
containerd_arch: "amd64"

containerd_install_dir: "/usr/local"
containerd_config_dir: "/etc/containerd"
containerd_config_file: "/etc/containerd/config.toml"

containerd_service_url: "https://raw.githubusercontent.com/containerd/containerd/v{{ containerd_version }}/containerd.service"

containerd_cri_socket: "/run/containerd/containerd.sock"
containerd_systemd_cgroup: true

# Pinned OCI runtime and CNI dependencies
runc_version: "1.3.3"
cni_plugins_version: "1.8.0"

# Installation paths
runc_install_path: "/usr/local/sbin/runc"
cni_install_dir: "/opt/cni/bin"

# Official SHA-256 checksum for containerd 2.3.7 linux-amd64
containerd_archive_checksum: "sha256:09a1b669ac6d21e7e24c3c33a9805b48987ba5845e8d88f039c47013a0c0025c"

containerd_archive_name: "containerd-{{ containerd_version }}-linux-{{ containerd_arch }}.tar.gz"
containerd_download_url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/{{ containerd_archive_name }}"

# runc release artifact and checksum
runc_download_url: "https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.{{ containerd_arch }}"
runc_checksum: "sha256:8781ab9f71c12f314d21c8e85f13ca1a82d90cf475aa5131a7b543fcc5487543"

# CNI plugins release artifact and checksum
cni_plugins_archive: "cni-plugins-linux-{{ containerd_arch }}-v{{ cni_plugins_version }}.tgz"
cni_plugins_download_url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/{{ cni_plugins_archive }}"
cni_plugins_checksum: "sha256:ab3bda535f9d90766cccc90d3dddb5482003dd744d7f22bcf98186bf8eea8be6"

# Temporary download directory
containerd_download_dir: "/tmp/containerd-install"
