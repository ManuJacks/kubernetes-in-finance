---
etcd_backup_dir: "/var/backups/etcd"
etcd_backup_user: "root"
etcd_backup_group: "root"
# Hourly snapshots support a 1-hour RPO (docs/monitoring/README.md). Every
# control-plane node snapshots; at ~8 MB each, 3 days of retention is ~1.7 GB.
etcd_backup_retention_days: 3
etcd_backup_schedule: "hourly"
# Spread the three control-plane timers so they do not contend for the lock.
etcd_backup_randomized_delay: "5min"

# External NFS Storage Option
# When enabled, the role ensures nfs-common is installed and mounts the NFS export to etcd_backup_dir
etcd_backup_use_nfs: false
etcd_backup_nfs_server: ""
etcd_backup_nfs_export: ""
etcd_backup_nfs_mount_opts: "rw,sync,hard,intr"

# Safety guardrail: require backup directory to be an active mount point before taking snapshots
etcd_backup_require_mount: false

# etcd TLS and endpoint configurations (kubeadm defaults)
etcd_backup_endpoint: "https://127.0.0.1:2379"
etcd_backup_ca_cert: "/etc/kubernetes/pki/etcd/ca.crt"
etcd_backup_cert: "/etc/kubernetes/pki/etcd/server.crt"
etcd_backup_key: "/etc/kubernetes/pki/etcd/server.key"
