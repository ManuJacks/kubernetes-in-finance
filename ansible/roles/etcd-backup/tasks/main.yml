---
- name: Install NFS client package when NFS is enabled
  ansible.builtin.package:
    name: nfs-common
    state: present
  when: etcd_backup_use_nfs | bool

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "{{ etcd_backup_dir }}"
    state: directory
    owner: "{{ etcd_backup_user }}"
    group: "{{ etcd_backup_group }}"
    mode: "0700"

- name: Mount NFS backup export
  ansible.posix.mount:
    path: "{{ etcd_backup_dir }}"
    src: "{{ etcd_backup_nfs_server }}:{{ etcd_backup_nfs_export }}"
    fstype: nfs
    opts: "{{ etcd_backup_nfs_mount_opts }}"
    state: mounted
  when: etcd_backup_use_nfs | bool

- name: Deploy etcd backup script
  ansible.builtin.template:
    src: etcd-backup.sh.j2
    dest: /usr/local/bin/etcd-backup.sh
    owner: root
    group: root
    mode: "0750"

- name: Install the public key the cluster PKI archive is encrypted to
  when: etcd_backup_pki_recipient_key | length > 0
  block:
    - name: Ensure gpg is present
      ansible.builtin.package:
        name: gpg
        state: present

    - name: Ensure the backup configuration directory exists
      ansible.builtin.file:
        path: /etc/etcd-backup
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the PKI recipient public key
      ansible.builtin.copy:
        src: "{{ etcd_backup_pki_recipient_key }}"
        dest: "{{ etcd_backup_pki_recipient_path }}"
        owner: root
        group: root
        mode: "0644"

- name: Deploy etcd backup systemd service
  ansible.builtin.template:
    src: etcd-backup.service.j2
    dest: /etc/systemd/system/etcd-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: Deploy etcd backup systemd timer
  ansible.builtin.template:
    src: etcd-backup.timer.j2
    dest: /etc/systemd/system/etcd-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: Flush handlers before service state
  ansible.builtin.meta: flush_handlers

- name: Enable and start etcd backup timer
  ansible.builtin.systemd:
    name: etcd-backup.timer
    state: started
    enabled: true
