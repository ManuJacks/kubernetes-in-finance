---
# Validation only. This workflow never connects to the cluster and runs only
# on GitHub-hosted runners; see ADR-005 (amendment 2026-11-21) for why
# deployment is not automated from this public repository.
name: CI

"on":
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible:
    name: Ansible lint and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          pip install "ansible-core==2.21.6" "ansible-lint==26.11.0" "yamllint==1.38.0"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint (production profile)
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ansible.cfg
        run: ansible-lint -c ../.ansible-lint playbooks/ roles/

      - name: Playbook syntax check
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          for playbook in ansible/playbooks/*.yml; do
            echo "::group::$playbook"
            ansible-playbook -i ansible/inventory/hosts.example.yml "$playbook" --syntax-check
            echo "::endgroup::"
          done

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: "1.17.2"

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  scripts-and-tests:
    name: ShellCheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          pip install "pytest==7.4.4" "PyYAML==6.0.4"
          sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/gameday/*.sh

      - name: pytest
        run: python -m pytest -v tests

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
