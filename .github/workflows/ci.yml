---
# Validation only. This workflow never connects to the cluster and runs only
# on GitHub-hosted runners; see ADR-005 (amendment 2026-11-21) for why
# deployment is not automated from this public repository.
name: CI

"on":
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible:
    name: Ansible lint and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          pip install "ansible-core==2.21.6" "ansible-lint==26.11.0" "yamllint==1.38.0"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint (production profile)
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ansible.cfg
        run: ansible-lint -c ../.ansible-lint playbooks/ roles/

      - name: Playbook syntax check
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          for playbook in ansible/playbooks/*.yml; do
            echo "::group::$playbook"
            ansible-playbook -i ansible/inventory/hosts.example.yml "$playbook" --syntax-check
            echo "::endgroup::"
          done

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: "1.17.2"

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  scripts-and-tests:
    name: ShellCheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          pip install "pytest==7.4.4" "PyYAML==6.0.4"
          sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: ShellCheck
        run: |
          shellcheck -x scripts/*.sh scripts/gameday/*.sh scripts/drills/*.sh scripts/alerting/*.sh scripts/dr/*.sh
          shellcheck -s sh monitoring/collectors/*.sh monitoring/alertmanager/tests/*.sh

      - name: pytest
        run: python -m pytest -v tests

  monitoring:
    name: Prometheus config and rule tests
    runs-on: ubuntu-latest
    env:
      ALERTMANAGER_IMAGE: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
      PROMETHEUS_IMAGE: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Cluster CA and client credentials are installed only on the monitoring
      # host by Ansible; promtool requires the files to exist, so use empty
      # placeholders in a copy of the configuration.
      - name: promtool check config
        run: |
          cp -r monitoring/prometheus "$RUNNER_TEMP/prometheus"
          touch "$RUNNER_TEMP"/prometheus/kubernetes-{ca,client}.crt "$RUNNER_TEMP/prometheus/kubernetes-client.key"
          docker run --rm -v "$RUNNER_TEMP/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" \
            check config /etc/prometheus/prometheus.yml

      - name: promtool test rules
        run: >-
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro"
          --entrypoint promtool "$PROMETHEUS_IMAGE"
          test rules /etc/prometheus/tests/rules.test.yml

      - name: amtool check-config
        run: >-
          docker run --rm -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro"
          --entrypoint amtool "$ALERTMANAGER_IMAGE"
          check-config /etc/alertmanager/alertmanager.yml

      - name: Alertmanager routing tests
        run: >-
          docker run --rm -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro"
          --entrypoint sh "$ALERTMANAGER_IMAGE"
          /etc/alertmanager/tests/routes.sh /etc/alertmanager/alertmanager.yml

      - name: Dashboards are valid JSON
        run: for f in monitoring/grafana/dashboards/*.json; do python3 -m json.tool "$f" >/dev/null; done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
