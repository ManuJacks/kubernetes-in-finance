---
# Portable Prometheus configuration. Deployed on the engineering host today
# (ansible/playbooks/13-monitoring.yml); the same rules and dashboards are
# intended to move into the cluster once worker capacity allows. The API
# availability probe should stay outside the cluster's failure domain.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: kubernetes-in-finance

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]

  # Host metrics plus textfile metrics: etcd backup RPO and drill results.
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # SLI: Kubernetes API readiness through the load-balanced VIP, as clients see it.
  - job_name: api-vip
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /probe
    params:
      module: [k8s_readyz]
    static_configs:
      - targets: ["https://10.97.3.100:6443/readyz"]
        labels:
          slo: api-availability
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Diagnostic (not part of the SLO): each API server directly, bypassing HAProxy.
  - job_name: api-servers
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /probe
    params:
      module: [k8s_readyz]
    static_configs:
      - targets:
          - https://10.97.0.16:6443/readyz
          - https://10.97.1.160:6443/readyz
          - https://10.97.2.213:6443/readyz
    relabel_configs: *blackbox_relabel

  - job_name: blackbox
    static_configs:
      - targets: ["127.0.0.1:9115"]

  # Per-container resource usage from each kubelet's cAdvisor, through the
  # API server node proxy (the kubelets are not reachable from the host
  # otherwise). Credentials are installed from the kubeconfig by Ansible.
  - job_name: kubernetes-cadvisor
    scrape_interval: 15s
    scrape_timeout: 10s
    scheme: https
    tls_config: &cluster_tls
      ca_file: /etc/prometheus/kubernetes-ca.crt
      cert_file: /etc/prometheus/kubernetes-client.crt
      key_file: /etc/prometheus/kubernetes-client.key
    static_configs:
      - targets: ["10.97.3.100:6443"]
        labels: {node: tf-ha-control1, endpoint: cadvisor}
      - targets: ["10.97.3.100:6443"]
        labels: {node: tf-ha-control2, endpoint: cadvisor}
      - targets: ["10.97.3.100:6443"]
        labels: {node: tf-ha-control3, endpoint: cadvisor}
      - targets: ["10.97.3.100:6443"]
        labels: {node: tf-ha-worker1, endpoint: cadvisor}
      - targets: ["10.97.3.100:6443"]
        labels: {node: tf-ha-worker2, endpoint: cadvisor}
    relabel_configs:
      - source_labels: [node]
        target_label: __metrics_path__
        regex: (.*)
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      - source_labels: [node]
        target_label: instance

  # Kubernetes object state (pod phase, container waiting reasons, replica
  # counts) from kube-state-metrics, through the API server service proxy.
  - job_name: kube-state-metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    scheme: https
    metrics_path: /api/v1/namespaces/kube-system/services/kube-state-metrics:http/proxy/metrics
    tls_config: *cluster_tls
    static_configs:
      - targets: ["10.97.3.100:6443"]
        labels:
          endpoint: kube-state-metrics
    relabel_configs:
      - target_label: instance
        replacement: kube-state-metrics
