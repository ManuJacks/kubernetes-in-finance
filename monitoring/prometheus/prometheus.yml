global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: kubernetes-in-finance
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 127.0.0.1:9093
rule_files:
- /etc/prometheus/rules/*.yml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - 127.0.0.1:9090
- job_name: alertmanager
  static_configs:
  - targets:
    - 127.0.0.1:9093
- job_name: node
  static_configs:
  - targets:
    - 127.0.0.1:9100
- job_name: api-vip
  scrape_interval: 10s
  scrape_timeout: 5s
  metrics_path: /probe
  params:
    module:
    - k8s_readyz
  static_configs:
  - targets:
    - https://10.97.3.100:6443/readyz
    labels:
      slo: api-availability
  relabel_configs: &id001
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: 127.0.0.1:9115
- job_name: api-servers
  scrape_interval: 10s
  scrape_timeout: 5s
  metrics_path: /probe
  params:
    module:
    - k8s_readyz
  static_configs:
  - targets:
    - https://10.97.0.16:6443/readyz
    - https://10.97.1.160:6443/readyz
    - https://10.97.2.213:6443/readyz
  relabel_configs: *id001
- job_name: blackbox
  static_configs:
  - targets:
    - 127.0.0.1:9115
- job_name: kubernetes-cadvisor
  scrape_interval: 15s
  scrape_timeout: 10s
  scheme: https
  tls_config:
    ca_file: /etc/prometheus/kubernetes-ca.crt
    cert_file: /etc/prometheus/kubernetes-client.crt
    key_file: /etc/prometheus/kubernetes-client.key
  static_configs:
  - targets:
    - 10.97.3.100:6443
    labels:
      node: tf-ha-control1
      endpoint: cadvisor
  - targets:
    - 10.97.3.100:6443
    labels:
      node: tf-ha-control2
      endpoint: cadvisor
  - targets:
    - 10.97.3.100:6443
    labels:
      node: tf-ha-control3
      endpoint: cadvisor
  - targets:
    - 10.97.3.100:6443
    labels:
      node: tf-ha-worker1
      endpoint: cadvisor
  - targets:
    - 10.97.3.100:6443
    labels:
      node: tf-ha-worker2
      endpoint: cadvisor
  relabel_configs:
  - source_labels:
    - node
    target_label: __metrics_path__
    regex: (.*)
    replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  - source_labels:
    - node
    target_label: instance
