---
# Workload and object-state failures, from kube-state-metrics (scraped through
# the API server proxy). cAdvisor says what containers consume; these say what
# Kubernetes is failing to do. Triage steps: docs/runbooks/kubernetes-workloads.md
groups:
  - name: kubernetes-workloads
    rules:
      # Without this, every rule below goes silent when KSM is down.
      - alert: KubeStateMetricsDown
        expr: up{job="kube-state-metrics"} == 0 or absent(up{job="kube-state-metrics"})
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: kube-state-metrics is not being scraped; workload health alerts are blind.
          runbook: docs/runbooks/kubernetes-workloads.md

      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready", status="true"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Node {{ $labels.node }} has been NotReady for 5 minutes."
          runbook: docs/runbooks/kubernetes-workloads.md

      - alert: KubePodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is in CrashLoopBackOff."
          runbook: docs/runbooks/kubernetes-workloads.md

      # Pages: workers have ~950 MiB and memory limits are overcommitted, so an
      # OOM kill is an early sign of node memory exhaustion and must be looked
      # at immediately (ADR-006). last_terminated_reason persists after the
      # restart, so require a restart in the window to avoid alerting on an
      # OOM from days ago.
      - alert: KubeContainerOOMKilled
        expr: |
          increase(kube_pod_container_status_restarts_total[10m]) >= 1
          and on (namespace, pod, container)
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} was OOMKilled in the last 10 minutes."
          runbook: docs/runbooks/kubernetes-workloads.md

      - alert: KubeContainerImagePullFailing
        expr: kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff|InvalidImageName"} == 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} cannot pull the image for {{ $labels.container }} ({{ $labels.reason }})."
          runbook: docs/runbooks/kubernetes-workloads.md

      # Usually a missing Secret or ConfigMap referenced by the pod spec.
      - alert: KubeContainerConfigError
        expr: kube_pod_container_status_waiting_reason{reason=~"CreateContainerConfigError|CreateContainerError"} == 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} cannot be created ({{ $labels.reason }})."
          runbook: docs/runbooks/kubernetes-workloads.md

      - alert: KubePodStuckPending
        expr: kube_pod_status_phase{phase="Pending"} == 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} has been Pending for 10 minutes (unschedulable, or waiting on a volume)."
          runbook: docs/runbooks/kubernetes-workloads.md

      - alert: KubeDeploymentReplicasUnavailable
        expr: kube_deployment_spec_replicas > kube_deployment_status_replicas_available
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired for 10 minutes."
          runbook: docs/runbooks/kubernetes-workloads.md

      - alert: KubeStatefulSetReplicasUnavailable
        expr: kube_statefulset_replicas > kube_statefulset_status_replicas_ready
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has fewer ready replicas than desired for 10 minutes."
          runbook: docs/runbooks/kubernetes-workloads.md

      # Cilium and kube-proxy-style agents run as DaemonSets: a missing pod
      # means a node without networking.
      - alert: KubeDaemonSetPodsUnavailable
        expr: kube_daemonset_status_desired_number_scheduled > kube_daemonset_status_number_available
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} is not available on every node it should run on."
          runbook: docs/runbooks/kubernetes-workloads.md

      - alert: KubeJobFailed
        expr: kube_job_status_failed > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} has failed pods."
          runbook: docs/runbooks/kubernetes-workloads.md

      # The cluster has no StorageClass yet, so any dynamically provisioned
      # claim stays Pending.
      - alert: KubePersistentVolumeClaimPending
        expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been Pending for 10 minutes."
          runbook: docs/runbooks/kubernetes-workloads.md
