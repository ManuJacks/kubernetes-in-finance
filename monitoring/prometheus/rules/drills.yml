---
# Recovery drills provide RTO evidence. A user systemd timer runs the restore
# drill weekly (roles/monitoring); KPI: last successful drill within 7 days.
# RTO cannot be measured continuously; drills record outcome and duration.
groups:
  - name: recovery-drills
    rules:
      - record: platform_drill:age_seconds
        expr: time() - platform_drill_last_run_timestamp_seconds

      - alert: PlatformDrillFailed
        expr: platform_drill_last_success{drill!="workload_node_loss"} == 0
        labels:
          severity: ticket
        annotations:
          summary: The most recent recovery drill failed.
          runbook: docs/runbooks/etcd-backup-restore.md

      - alert: PlatformDrillOverdue
        expr: platform_drill:age_seconds{drill!="workload_node_loss"} > 8 * 86400
        labels:
          severity: ticket
        annotations:
          summary: No recovery drill has run in 8 days (weekly schedule); recovery evidence is stale.
          runbook: docs/runbooks/etcd-backup-restore.md

  # KPI 5: workload recovery <= 6 min after a worker is lost. The drill powers
  # off a worker, so it runs by hand monthly, not on a timer
  # (docs/runbooks/workload-recovery-drill.md).
  - name: workload-recovery-drill
    rules:
      - alert: WorkloadRecoveryDrillFailed
        expr: platform_drill_last_success{drill="workload_node_loss"} == 0
        labels:
          severity: ticket
        annotations:
          summary: "The last workload recovery drill ({{ $labels.host }}) did not restore full capacity."
          runbook: docs/runbooks/workload-recovery-drill.md

      - alert: WorkloadRecoveryObjectiveMissed
        expr: platform_drill_duration_seconds{drill="workload_node_loss"} > 360
        labels:
          severity: ticket
        annotations:
          summary: "Workload recovery took {{ $value | humanizeDuration }} in the last drill; the objective is 6 minutes."
          runbook: docs/runbooks/workload-recovery-drill.md

      # The drill also proves the node-loss page works end to end.
      - alert: NodeLossAlertNotVerified
        expr: platform_drill_alert_fired{drill="workload_node_loss"} == 0
        labels:
          severity: ticket
        annotations:
          summary: "KubeNodeNotReady did not fire during the last node-loss drill; node loss may go undetected."
          runbook: docs/runbooks/workload-recovery-drill.md

      - alert: WorkloadRecoveryDrillOverdue
        expr: platform_drill:age_seconds{drill="workload_node_loss"} > 35 * 86400
        labels:
          severity: ticket
        annotations:
          summary: No workload recovery drill in 35 days (monthly); KPI 5 evidence is stale.
          runbook: docs/runbooks/workload-recovery-drill.md
