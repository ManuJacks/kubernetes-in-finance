---
# Recovery drills provide RTO evidence. RTO cannot be measured continuously;
# it is demonstrated by drills, which record their outcome and duration.
groups:
  - name: recovery-drills
    rules:
      - record: platform_drill:age_seconds
        expr: time() - platform_drill_last_run_timestamp_seconds

      - alert: PlatformDrillFailed
        expr: platform_drill_last_success == 0
        labels:
          severity: ticket
        annotations:
          summary: The most recent recovery drill failed.
          runbook: docs/runbooks/etcd-backup-restore.md

      - alert: PlatformDrillOverdue
        expr: platform_drill:age_seconds > 30 * 86400
        labels:
          severity: ticket
        annotations:
          summary: No recovery drill has run in 30 days; recovery evidence is stale.
          runbook: docs/runbooks/etcd-backup-restore.md
