---
# SLO: 99.9% of probes of https://10.97.3.100:6443/readyz succeed over 30 days.
# Error budget: 0.1% (about 43 minutes per 30 days).
# Burn-rate alerting follows the multi-window, multi-burn-rate method
# (Google SRE Workbook, "Alerting on SLOs").
groups:
  - name: api-availability-sli
    interval: 30s
    rules:
      - record: sli:api_availability:error_ratio_rate5m
        expr: 1 - avg_over_time(probe_success{job="api-vip"}[5m])
      - record: sli:api_availability:error_ratio_rate30m
        expr: 1 - avg_over_time(probe_success{job="api-vip"}[30m])
      - record: sli:api_availability:error_ratio_rate1h
        expr: 1 - avg_over_time(probe_success{job="api-vip"}[1h])
      - record: sli:api_availability:error_ratio_rate6h
        expr: 1 - avg_over_time(probe_success{job="api-vip"}[6h])
      - record: sli:api_availability:error_ratio_rate3d
        expr: 1 - avg_over_time(probe_success{job="api-vip"}[3d])
      - record: sli:api_availability:error_ratio_rate30d
        expr: 1 - avg_over_time(probe_success{job="api-vip"}[30d])
      - record: slo:api_availability:error_budget_remaining_ratio
        expr: 1 - (sli:api_availability:error_ratio_rate30d / 0.001)

  - name: api-availability-burn-rate
    rules:
      - alert: ApiAvailabilityFastBurn
        expr: |
          sli:api_availability:error_ratio_rate1h > (14.4 * 0.001)
          and
          sli:api_availability:error_ratio_rate5m > (14.4 * 0.001)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: API availability error budget burning at more than 14.4x (2% of the 30-day budget per hour).
          runbook: docs/gameday/2026-11-21-api-availability.md

      - alert: ApiAvailabilitySlowBurn
        expr: |
          sli:api_availability:error_ratio_rate6h > (6 * 0.001)
          and
          sli:api_availability:error_ratio_rate30m > (6 * 0.001)
        for: 15m
        labels:
          severity: page
        annotations:
          summary: API availability error budget burning at more than 6x (5% of the 30-day budget in 6 hours).
          runbook: docs/gameday/2026-11-21-api-availability.md

      - alert: ApiAvailabilityBudgetErosion
        expr: |
          sli:api_availability:error_ratio_rate3d > 0.001
          and
          sli:api_availability:error_ratio_rate6h > 0.001
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: API availability is consuming error budget faster than the SLO allows over 3 days.
          runbook: docs/gameday/2026-11-21-api-availability.md

      - alert: ApiAvailabilityProbeAbsent
        expr: absent(probe_success{job="api-vip"})
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: The API availability probe is not reporting; the SLO is not being measured.
          runbook: docs/gameday/2026-11-21-api-availability.md
