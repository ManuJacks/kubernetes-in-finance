---
# Alerts about the alerting path itself. These are visible in Prometheus and
# Grafana even when delivery is what is broken. Prometheus failing entirely
# is not detected here: that needs an external dead man's switch.
groups:
  - name: alerting-pipeline
    rules:
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0 or absent(up{job="alertmanager"})
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: Alertmanager is not reachable; alerts are not being delivered.
          runbook: docs/monitoring/README.md

      - alert: AlertNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "Alertmanager failed to deliver notifications via {{ $labels.integration }} in the last 15 minutes."
          runbook: docs/monitoring/README.md
